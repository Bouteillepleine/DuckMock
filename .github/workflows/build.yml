name: Build

on:
  push:
    branches: [ master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  NDK_VERSION: "29.0.14206865"
  CMAKE_VERSION: "3.31.6"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Fetch native dependencies
        # Not `submodules: recursive` on the checkout: LSPlant declares test-only submodules
        # over git@github.com:, which a blanket recursive fetch tries (and fails) to clone over
        # SSH. Only what the build compiles is pulled, including dex_builder, which a plain
        # `--recursive` silently skips.
        run: |
          set -euo pipefail
          git submodule update --init external/LSPlant external/Dobby external/xz-embedded
          git -C external/LSPlant submodule update --init \
            lsplant/src/main/jni/external/dex_builder
          git -C external/LSPlant/lsplant/src/main/jni/external/dex_builder \
            submodule update --init external/parallel_hashmap
          test -f external/LSPlant/lsplant/src/main/jni/external/dex_builder/CMakeLists.txt

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Drop machine-local JDK path
        run: sed -i '/org.gradle.java.home/d' gradle.properties

      - name: Install NDK and CMake
        # LSPlant needs CMake >= 3.28 (C++23 modules); Dobby's arm64 assembly needs NDK 29.
        run: |
          set -euo pipefail
          echo "y" | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "ndk;${NDK_VERSION}" "cmake;${CMAKE_VERSION}"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Decode signing keystore
        # Never in the repo. A checkout without the secrets still builds, just unsigned.
        env:
          KEYSTORE_B64: ${{ secrets.DUCKMOCK_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/duckmock-release.jks"
            echo "DUCKMOCK_STORE_FILE=$RUNNER_TEMP/duckmock-release.jks" >> "$GITHUB_ENV"
            echo "signing keystore decoded"
          else
            echo "::warning::No DUCKMOCK_KEYSTORE_BASE64 secret; the manager APK will be unsigned."
          fi

      - name: Build
        env:
          DUCKMOCK_STORE_PASSWORD: ${{ secrets.DUCKMOCK_STORE_PASSWORD }}
          DUCKMOCK_KEY_ALIAS: ${{ secrets.DUCKMOCK_KEY_ALIAS }}
          DUCKMOCK_KEY_PASSWORD: ${{ secrets.DUCKMOCK_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease :zygote:assembleRelease :probe:assembleDebug \
            --no-daemon --stacktrace

      - name: Verify the module zip
        run: |
          set -euo pipefail
          ZIP=$(ls zygote/build/outputs/magisk/release/*.zip)
          LIST=$(unzip -l "$ZIP")
          for f in module.prop classes.dex customize.sh service.sh post-fs-data.sh \
                   uninstall.sh action.sh describe.sh packages/android \
                   zygisk/arm64-v8a.so zygisk/armeabi-v7a.so \
                   lib/arm64-v8a/libduckmock.so lib/armeabi-v7a/libduckmock.so \
                   customize.d/00-verify-resources.sh; do
            grep -q " $f\$" <<< "$LIST" && echo "  ok: $f" \
              || { echo "  MISSING: $f"; echo "$LIST"; exit 1; }
          done
          unzip -p "$ZIP" module.prop | grep -qE '^id=duckmock$' \
            && echo "  ok: module id" || { echo "  bad module id"; exit 1; }
          unzip -p "$ZIP" module.prop | grep -qE '^author=XxxY$' \
            && echo "  ok: author" || { echo "  bad author"; exit 1; }
          echo "Module zip verified: $ZIP"

      - name: Verify the installer's own resource hashes
        # 00-verify-resources.sh carries a sha256 per shipped file and the on-device installer
        # refuses the module if one does not match. Generated at package time, so a packaging
        # bug shows up here rather than as a failed flash.
        run: |
          set -euo pipefail
          ZIP=$(ls zygote/build/outputs/magisk/release/*.zip)
          rm -rf _zip && mkdir _zip && unzip -q "$ZIP" -d _zip
          bad=0
          while read -r path want; do
            [ -n "${path:-}" ] || continue
            got=$(sha256sum "_zip/$path" | cut -d' ' -f1)
            if [ "$got" = "$want" ]; then
              echo "  ok: $path"
            else
              echo "  MISMATCH: $path"
              echo "    packaged $got"
              echo "    declared $want"
              bad=1
            fi
          done < <(sed -n 's/^do_verify  *\([^ ]*\)  *\([0-9a-f]\{64\}\).*/\1 \2/p' \
                     _zip/customize.d/00-verify-resources.sh)
          [ "$bad" = 0 ] || exit 1

      - name: Stage artifacts
        # Without the signing secrets AGP names the output app-release-unsigned.apk, so the
        # name is discovered rather than assumed, and the log says which one was staged.
        run: |
          set -euo pipefail
          APK=""
          for c in app/build/outputs/apk/release/app-release.apk                    app/build/outputs/apk/release/app-release-unsigned.apk; do
            [ -f "$c" ] && { APK="$c"; break; }
          done
          [ -n "$APK" ] || { echo "no manager APK was built"; ls -R app/build/outputs/apk; exit 1; }
          case "$APK" in
            *-unsigned.apk) echo "::warning::Staging an UNSIGNED manager APK; it cannot be installed." ;;
            *) echo "manager APK is signed" ;;
          esac
          cp "$APK" ./DuckMock-manager.apk

          PROBE=$(ls probe/build/outputs/apk/debug/*.apk 2>/dev/null | head -1)
          [ -n "$PROBE" ] || { echo "no probe APK was built"; exit 1; }
          cp "$PROBE" ./DuckMock-probe.apk

          cp zygote/build/outputs/magisk/release/*.zip ./
          ls -l ./*.apk ./*.zip

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: DuckMock-release
          path: |
            DuckMock-manager.apk
            DuckMock-probe.apk
            DuckMock-*.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download verified artifacts
        uses: actions/download-artifact@v8
        with:
          name: DuckMock-release

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          ASSETS=(DuckMock-*.zip DuckMock-manager.apk DuckMock-probe.apk)
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::warning::$TAG already exists; replacing its assets."
            gh release upload "$TAG" "${ASSETS[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            gh release create "$TAG" "${ASSETS[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --title "DuckMock ${VERSION}" \
              --generate-notes
          fi
